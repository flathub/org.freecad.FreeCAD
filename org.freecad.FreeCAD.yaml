app-id: org.freecad.FreeCAD
default-branch: beta
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: FreeCAD
desktop-file-name-prefix: "(beta) "
rename-mime-icons:
  - application-x-extension-fcstd
finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --share=network
  - --filesystem=host # needed to make file saving work
  - --filesystem=xdg-run/gvfs # make GnomeVFS accessible
  - --filesystem=/run/spnav.sock:ro # allow access to spacenavd
  - --talk-name=org.freedesktop.Flatpak # to launch openscad
  - --env=TMPDIR=/var/tmp
  - --env=SPNAV_SOCKET=/run/spnav.sock
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm21
cleanup:
  - /include
  - /share/aclocal
  - /share/cmake
  - /share/doc
  - /share/pkgconfig
  - /share/info
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
build-options:
  append-path: /usr/lib/sdk/llvm21/bin
  append-ld-library-path: /usr/lib/sdk/llvm21/lib
modules:

  - shared-modules/glu/glu-9.json

  - name: swig
    config-opts:
      - --without-pcre
    cleanup:
      - '*'
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/swig/swig-4.3.1.tar.gz
        sha256: 44fc829f70f1e17d635a2b4d69acab38896699ecc24aa023e516e0eabbec61b8

  - name: eigen
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DEIGEN_BUILD_BLAS=OFF
      - -DEIGEN_BUILD_LAPACK=OFF
      - -DBUILD_TESTING=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.1/eigen-3.4.1.tar.bz2
        sha256: 8bb7280b7551bf06418d11a9671fdf998cb927830cf21589b394382d26779821

  - name: OpenBLAS
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DDYNAMIC_ARCH=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_STATIC_LIBS=OFF
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/releases/download/v0.3.34/OpenBLAS-0.3.34.tar.gz
        sha256: cd7e129868320cc2d033afa920e31202dfe0b8066a5b66661900ccc0f197dfed

  - name: graphviz
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/13.1.1/graphviz-13.1.1.tar.gz
        sha256: 7d90f72e34f6a07b5f7c23a52c6a9348f67ae68883689bcbfa58e34c67baf594
      - type: shell
        commands:
          - sed -i '/LIBPOSTFIX="64"/s/64//' configure.ac
          - autoreconf -vfi

  - name: xerces-c
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://downloads.apache.org/xerces/c/3/sources/xerces-c-3.3.0.tar.gz
        sha256: 9555f1d06f82987fbb4658862705515740414fd34b4db6ad2ed76a2dc08d3bde
      - type: patch
        path: patches/xerces-c-cxx17.patch

  - name: openmpi
    cleanup:
      - /bin
      - /share/hwloc
      - /share/openmpi
      - /share/pmix
      - /share/prte
    sources:
      - type: archive
        url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.5.tar.bz2
        sha256: 6588d57c0a4bd299a24103f4e196051b29e8b55fbda49e11d5b3d32030a32776

  - name: hdf5
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DALLOW_UNSUPPORTED=ON
      - -DHDF5_BUILD_HL_LIB=ON
      - -DHDF5_BUILD_CPP_LIB=ON
      - -DHDF5_ENABLE_PARALLEL=ON
      - -DHDF5_ENABLE_Z_LIB_SUPPORT=ON
      - -DBUILD_TESTING=OFF
    cleanup:
      - /bin
      - /cmake
    sources:
      - type: archive
        url: https://github.com/HDFGroup/hdf5/archive/hdf5-1_14_3.tar.gz
        sha256: df5ee33c74d5efb59738075ef96f4201588e1f1eeb233f047ac7fd1072dee1f6
  - name: medfile
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DMEDFILE_BUILD_PYTHON=ON
      - -DMEDFILE_BUILD_TESTS=OFF
      - -DMEDFILE_INSTALL_DOC=OFF
      # setting this to ON fails building FreeCAD.
      - -DMEDFILE_USE_MPI=OFF
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/chennes/med/archive/refs/tags/v6.0.1.tar.gz
        sha256: 62f163812e4df09c23e93d42342856a6da438cbf98d9dfe0360ce7b14a92b035
      - type: patch
        path: patches/med-headergen.patch

  - name: libspnav
    sources:
      - type: archive
        url: https://github.com/FreeSpacenav/libspnav/releases/download/v1.2/libspnav-1.2.tar.gz
        sha256: 093747e7e03b232e08ff77f1ad7f48552c06ac5236316a5012db4269951c39db

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=filesystem,program_options,regex,system,thread,python,date_time,chrono,atomic,iostreams
      - ./b2 install -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.86.0/source/boost_1_86_0.tar.bz2
        sha256: 1bed88e40401b2cb7a1f76d4bab499e352fa4d0c5f31c0dbae64e24d34d7513b
  - name: coin
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DZLIB_RUNTIME_LINKING=OFF
      - -DCOIN_BUILD_TESTS=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/coin3d/coin/releases/download/v4.0.8/coin-4.0.8-src.tar.gz
        sha256: aff6c7edf24cfb935edba46574ec5f83b543c47ff79e40c21fb92dc709b0f2c4

  # modules required to build pybind11, opencamlib and kiwisolver
  - python3-build-dependencies.yaml

  # pybind from pip doesn't install cmake and include files where freecad finds them so we use cmake
  - name: pybind11
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: archive
        url: https://github.com/pybind/pybind11/archive/refs/tags/v3.0.2.tar.gz
        sha256: 2f20a0af0b921815e0e169ea7fec63909869323581b89d7de1553468553f6a2d
      - type: shell
        commands:
        - pip3 install . --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST} --no-build-isolation

  # modules used in pyside, FreeCAD and matplotlib dependencies
  - python3-modules.yaml

  - name: pyside
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      env:
        PYTHONPATH: /run/build/pyside/_flatpak_build/sources
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTS=OFF
      - -DFORCE_LIMITED_API=OFF
      - -DNUMPY_INCLUDE_DIR=/app/lib/python3.13/site-packages/numpy/_core/include
      - -DSHIBOKEN_FORCE_PROCESS_SYSTEM_INCLUDE_PATHS=/usr/include
    cleanup:
      - /bin
      - /lib/plugins/designer
      - /PySide6
      - /share/PySide6/glue
      - /share/PySide6/doc
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.11.1-src/pyside-setup-everywhere-src-6.11.1.tar.xz
        sha256: 6ffd9835bb0dd2c56f061d62f1616bb1707cfc0202b80e3165d6be087f3965e2
      - type: patch
        paths:
          - patches/pyside-fix-header-installation-path.patch
          - patches/pyside-fix-header-packaging.patch

  - name: pivy
    buildsystem: cmake-ninja
    config-opts:
      - -DPIVY_USE_QT6=ON
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/coin3d/pivy/archive/refs/tags/0.6.11.tar.gz
        sha256: 78f79bd7d1ce7e8140ceba4b1220136ea1f14b4403b1e463c59fa892feed961e
      - type: shell
        commands:
          - |
            sitepackagesDir=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["platlib"].replace("/usr","/app"))')
            sed -i "s|\${Python_SITEARCH}|$sitepackagesDir|" {*/,./}CMakeLists.txt

  - name: qhull
    buildsystem: cmake-ninja
    cleanup:
      - /bin
      - /share/doc
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_STATIC_LIBS=OFF
      - -DLINK_APPS_SHARED=ON
    sources:
      - type: archive
        url: http://www.qhull.org/download/qhull-2020-src-8.0.2.tgz
        sha256: b5c2d7eb833278881b952c8a52d20179eab87766b00b865000469a45c1838b7e

  # matplotlib requires additional sources so we can't simply use flatpak-pip-generator for it
  - name: python3-matplotlib
    buildsystem: simple
    build-commands:
      - python -m pip install --root=/ --prefix=/app --no-build-isolation --config-settings=setup-args="-Dsystem-freetype=true" --config-settings=setup-args="-Dsystem-qhull=true" .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/df/17/1747b4154034befd0ed33b52538f5eb7752d05bb51c5e2a31470c3bc7d52/matplotlib-3.9.4.tar.gz
        sha256: 1e00e8be7393cbdc6fedfa8a6fba02cf3e83814b285db1c60b906a023ba41bc3

  - name: git
    cleanup:
      - /share/perl5
      - /share/gitweb
    make-args:
      - NO_TCLTK=YesPlease
      - INSTALL_SYMLINKS=1
    make-install-args:
      - NO_TCLTK=YesPlease
      - INSTALL_SYMLINKS=1
    post-install:
      - find . -type f -name perllocal.pod -delete
    sources:
      - type: archive
        url: https://www.kernel.org/pub/software/scm/git/git-2.49.0.tar.gz
        sha256: f8047f572f665bebeb637fd5f14678f31b3ca5d2ff9a18f20bd925bd48f75d3c

  - name: geos
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/libgeos/geos/releases/download/3.14.1/geos-3.14.1.tar.bz2
        sha256: 3c20919cda9a505db07b5216baa980bacdaa0702da715b43f176fb07eff7e716

  # This is necessary for ifcopenshell (in the BIM workbench). There is no error at build time
  # nor tests when it is missing, but if you try to setup a new BIM project it will fail.
  # See https://github.com/FreeCAD/FreeCAD/issues/28769
  - name: python3-shapely
    buildsystem: simple
    build-options:
      # This is where the numpy headers can be found.
      cppflags: -I/app/lib/python3.13/site-packages/numpy/_core/include
    build-commands:
      - pip3 install --verbose --exists-action=i --no-index --find-links="file://${PWD}"
        --prefix=${FLATPAK_DEST} "shapely" --no-build-isolation
    sources:
      - type: file
        url: https://files.pythonhosted.org/packages/4d/bc/0989043118a27cccb4e906a46b7565ce36ca7b57f5a18b78f4f1b0f72d9d/shapely-2.1.2.tar.gz
        sha256: 2ed4ecb28320a433db18a5bf029986aa8afcfd740745e78847e330d5d94922a9


  - name: netcdf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -Wno-dev
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://downloads.unidata.ucar.edu/netcdf-c/4.9.2/netcdf-c-4.9.2.tar.gz
        sha256: cf11babbbdb9963f09f55079e0b019f6d0371f52f8e1264a5ba8e9fdab1a6c48

  - name: VTK
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DVTK_WRAP_PYTHON=on
      - -DVTK_BUILD_TESTING=OFF
    cleanup:
      - /bin
      - /share/doc
      - /share/vtk-*/proj
    sources:
      - type: archive
        url: https://www.vtk.org/files/release/9.4/VTK-9.4.2.tar.gz
        sha256: 36c98e0da96bb12a30fe53708097aa9492e7b66d5c3b366e1c8dc251e2856a02

  - name: flann
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_MATLAB_BINDINGS=OFF
      - -DBUILD_PYTHON_BINDINGS=OFF
      - -DBUILD_STATIC_LIBS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_DOC=OFF
    sources:
      - type: archive
        url: https://github.com/flann-lib/flann/archive/refs/tags/1.9.2.tar.gz
        sha256: e26829bb0017f317d9cc45ab83ddcb8b16d75ada1ae07157006c1e7d601c8824

  - name: pcl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DWITH_QT=QT6
      - -DWITH_VTK=ON
      - -DBUILD_tools=ON
      - -DBUILD_global_tests=OFF
      - -DBUILD_examples=OFF
      - -DBUILD_apps=OFF
    cleanup:
      - /bin
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/pcl-*
    sources:
      - type: archive
        url: https://github.com/PointCloudLibrary/pcl/archive/refs/tags/pcl-1.15.1.tar.gz
        sha256: e1d862c7b6bd27a45884a825a2e509bfcbd4561307d5bfe17ce5c8a3d94a6c29

  # for opencascade. It was dropped from 24.08 runtime.
  - name: tcl
    subdir: unix
    build-options:
      no-debuginfo: true
    cleanup:
      - /bin
      - /man
    post-install:
      - ln -s tclsh8.6 /app/bin/tclsh
      - chmod 755 /app/lib/libtcl*.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.17/tcl8.6.17-src.tar.gz
        sha256: a3903371efcce8a405c5c245d029e9f6850258a60fa3761c4d58995610949b31
  # Tk will be cleaned up, but this tree of OCCT can not build without it.
  - name: tk
    subdir: unix
    build-options:
      no-debuginfo: true
    make-install-args:
      - install-private-headers
    cleanup:
      - '*'
    post-install:
      - chmod 755 /app/lib/libtk*.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.17/tk8.6.17-src.tar.gz
        sha256: e4982df6f969c08bf9dd858a6891059b4a3f50dc6c87c10abadbbe2fc4838946

  - name: opencascade
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DUSE_FREEIMAGE=OFF
      - -DUSE_VTK=ON
      - -DUSE_RAPIDJSON=OFF
      - -DBUILD_RELEASE_DISABLE_EXCEPTIONS=OFF
      - -DBUILD_DOC_Overview=OFF
      - -D3RDPARTY_VTK_INCLUDE_DIR=/app/include/vtk-9.4/
      # This is not enough to not require TCL, at least with this version of OCCT
      - -DUSE_TK=OFF
      - -DUSE_TCL=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    cleanup:
      - /bin
    sources:
      - type: git
        url: https://github.com/FreeCAD/OCCT.git
        commit: 8db1faa32e326889fc770b4389629d686ccb52d5 # tag patched/V7_8_1
      - type: patch # upstream patch, included in occt 7.9 release
        path: patches/occt-freetype-fix-compilation.patch

  # new deps for IfcOpenShell
  - name: mpfr
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/mpfr/mpfr-3.1.5.tar.xz
        sha256: 015fde82b3979fbe5f83501986d328331ba8ddf008c1ff3da3c238f49ca062bc
  - name: cgal
    cleanup:
      - /include
      - /lib/cmake
      - /share/man
      - /bin
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCGAL_HEADER_ONLY=ON
    sources:
      - type: archive
        url: https://github.com/CGAL/cgal/releases/download/v6.1/CGAL-6.1.tar.xz
        sha256: 618da8a8b3f5be46b4f0a47a1efb3c9e6c03d6aab0f5531d56d355d32701d79f
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz
        sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187

  - name: IfcOpenShell
    buildsystem: cmake-ninja
    builddir: true
    subdir: cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_GEOMSERVER=OFF
      - -DBUILD_CONVERT=ON
      - -DBUILD_SHARED_LIBS=ON
      - -DENABLE_BUILD_OPTIMIZATIONS=ON
      - -DGLTF_SUPPORT=ON
      - -DHDF5_SUPPORT=ON
      - -DCOLLADA_SUPPORT=OFF
      - -DLIBXML2_INCLUDE_DIR=/usr/include/libxml2
    build-options:
      cxxflags: -std=gnu++14
    build-commands:
      - sed -i 's|/usr|/app|g' ifcwrap/cmake_install.cmake
    sources:
      - type: git
        url: https://github.com/IfcOpenShell/IfcOpenShell.git
        tag: ifcopenshell-python-0.8.4
        commit: 158fe92644cfe2bc37be513d9838c95d9f2233cf

  - name: arpack
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_SHARED_LIBS=ON
      - -DBUILD_STATIC_LIBS=OFF
      - -DMPI=ON
    build-options:
      env:
        FFLAGS: -fallow-argument-mismatch
        FCFLAGS: -fallow-argument-mismatch
    sources:
      - type: archive
        url: https://github.com/opencollab/arpack-ng/archive/refs/tags/3.7.0.tar.gz
        sha256: 972e3fc3cd0b9d6b5a737c9bf6fd07515c0d6549319d4ffb06970e64fa3cc2d6

  - name: spooles
    buildsystem: simple
    build-commands:
      - make CC=gcc lib
      - make -C MT/src CC=gcc
      - install -Dt /app/lib *.a MT/src/*.a
      - for f in $(find -name '*.h'); do install -Dt "/app/include/$(dirname "$f")" "$f"; done
    sources:
      - type: archive
        url: http://deb.debian.org/debian/pool/main/s/spooles/spooles_2.2.orig.tar.gz
        sha256: a84559a0e987a1e423055ef4fdf3035d55b65bbe4bf915efaa1a35bef7f8c5dd
        strip-components: 0
        mirror-urls:
          - http://www.netlib.org/linalg/spooles/spooles.2.2.tgz # can be slow
      - type: patch
        path: patches/spooles-fix-compilation.patch

  - name: calculix-ccx
    buildsystem: simple
    build-commands:
      - make -C ccx_*/src -f Makefile_MT -j $FLATPAK_BUILDER_N_JOBS
      - install -m0755 ccx_*/src/ccx_*_MT /app/bin/ccx
    sources:
      - type: archive
        url: http://www.dhondt.de/ccx_2.23.src.tar.bz2
        sha256: 9c88385c10fb04f5dc6c4e98027a51bebdd8aee3920e05190d6c1dd08357d6e7
        strip-components: 2
      - type: patch
        path: patches/calculix-cxx-paths.patch

  - name: gmsh
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DENABLE_TESTS=OFF
    cleanup:
      - /share/doc
    sources:
      - type: archive
        url: https://gmsh.info/src/gmsh-4.15.0-source.tgz
        sha256: abb2632715bd7d0130ded7144fd6263635cd7dea883b8df61ba4da58ce6a1dfe

  - name: yaml-cpp
    buildsystem: cmake-ninja
    build-options:
      cxxflags: -include cstdint
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DYAML_CPP_BUILD_TOOLS=OFF
    sources:
      - type: git
        url: https://github.com/jbeder/yaml-cpp
        commit: 56e3bb550c91fd7005566f19c079cb7a503223cf # tag yaml-cpp-0.9.0

  - name: opencamlib
    buildsystem: simple
    build-commands:
      - pip3 install --exists-action=i --ignore-installed --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} . --no-build-isolation
    build-options:
      env:
        - CMAKE_ARGS: "${CMAKE_ARGS} -DBUILD_DOC:BOOL=OFF -DVERSION_STRING:STRING=2023.01.11"
    sources:
      - type: archive
        url: https://github.com/aewallin/opencamlib/archive/2023.01.11/opencamlib-2023.01.11.tar.gz
        sha256: 07fd9b61c39c4d600e441d67edbafc1015e9e3fabd88b561a647f98fedf31d41
      - type: patch
        path: patches/opencamlib-boost-shared-no-git-version-command.patch

  - name: elmerfem
    buildsystem: cmake-ninja
    builddir: true
    cleanup:
      - /share/elmersolver
    sources:
      - type: archive
        url: https://github.com/ElmerCSC/elmerfem/releases/download/release-26.2.1/elmerfem-release-26.2.1.tar.gz
        sha256: 729809851d07b0ee8d7aff636bc21745d65b35c94d90027f39958fb759ec1d31

  - name: opencv
    buildsystem: cmake-ninja
