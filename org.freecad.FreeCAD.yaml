app-id: org.freecad.FreeCAD
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
command: FreeCAD
rename-mime-icons:
  - application-x-extension-fcstd
finish-args:
  - --share=ipc
  - --socket=x11
  - --device=dri
  - --share=network
  - --filesystem=host # needed to make file saving work
  - --filesystem=xdg-run/gvfs # make GnomeVFS accessible
  - --filesystem=/run/spnav.sock:ro # allow access to spacenavd
  - --talk-name=org.freedesktop.Flatpak # to launch openscad
  - --env=TMPDIR=/var/tmp
  - --env=SPNAV_SOCKET=/run/spnav.sock
sdk-extensions:
  - org.freedesktop.Sdk.Extension.llvm22
cleanup:
  - /include
  - /share/aclocal
  - /share/cmake
  - /share/pkgconfig
  - /lib/cmake
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'
build-options:
  append-path: /usr/lib/sdk/llvm22/bin
  append-ld-library-path: /usr/lib/sdk/llvm22/lib
modules:

  - shared-modules/glu/glu-9.json

  # modules required to build pyside, pybind11, opencamlib, kiwisolver
  - python3-build-dependencies.yaml

  - name: pyside
    builddir: true
    buildsystem: cmake-ninja
    build-options:
      env:
        # $FLATPAK_BUILDER_BUILDDIR doesn't work
        - PYTHONPATH=/run/build/pyside/_flatpak_build/sources
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_TESTS=OFF
      - -DFORCE_LIMITED_API=no
      - -DNO_QT_TOOLS=yes
      - -DSHIBOKEN_PYTHON_LIBRARIES=-lpython3.13
      - -DNUMPY_INCLUDE_DIR=/app/lib/python3.13/site-packages/numpy/_core/include
      - -DSHIBOKEN_FORCE_PROCESS_SYSTEM_INCLUDE_PATHS=/usr/include
    cleanup:
      - /bin
      - /lib/plugins/designer
      - /share/PySide6
    sources:
      - type: archive
        url: https://download.qt.io/official_releases/QtForPython/pyside6/PySide6-6.11.1-src/pyside-setup-everywhere-src-6.11.1.tar.xz
        sha256: 6ffd9835bb0dd2c56f061d62f1616bb1707cfc0202b80e3165d6be087f3965e2
      - type: patch
        path: patches/pyside-fix-header-installation-path.patch
      - type: patch
        path: patches/pyside-fix-header-packaging.patch

  - name: swig
    config-opts:
      - --without-pcre
    cleanup:
      - '*'
    sources:
      - type: archive
        url: http://downloads.sourceforge.net/swig/swig-4.3.1.tar.gz
        sha256: 44fc829f70f1e17d635a2b4d69acab38896699ecc24aa023e516e0eabbec61b8

  - name: eigen
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DEIGEN_BUILD_BLAS=OFF
      - -DEIGEN_BUILD_LAPACK=OFF
    cleanup:
      - '*'
    sources:
      - type: archive
        url: https://gitlab.com/libeigen/eigen/-/archive/3.4.1/eigen-3.4.1.tar.bz2
        sha256: 8bb7280b7551bf06418d11a9671fdf998cb927830cf21589b394382d26779821

  - name: graphviz
    cleanup:
      - /share/doc
      - /share/graphviz
    sources:
      - type: archive
        url: https://gitlab.com/api/v4/projects/4207231/packages/generic/graphviz-releases/15.1.1/graphviz-15.1.1.tar.xz
        sha256: afc7c28dd43d3639910f58820bdce7d89655aa9ac0a4961ac67ffcf77e6a9ac3

  - name: xerces-c
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://downloads.apache.org/xerces/c/3/sources/xerces-c-3.3.0.tar.gz
        sha256: 9555f1d06f82987fbb4658862705515740414fd34b4db6ad2ed76a2dc08d3bde
      - type: patch
        path: patches/xerces-c-cxx17.patch

  # openmpi installs libevent, hwloc, pmix and prte
  - name: openmpi
    config-opts:
      - --enable-builtin-atomics
    cleanup:
      - /bin
      - /etc
      - /share/applications
      - /share/doc
      - /share/hwloc
      - /share/openmpi
      - /share/pmix
      - /share/prte
    sources:
      - type: archive
        url: https://download.open-mpi.org/release/open-mpi/v5.0/openmpi-5.0.10.tar.bz2
        sha256: 0acecc4fc218e5debdbcb8a41d182c6b0f1d29393015ed763b2a91d5d7374cc6

  - name: hdf5
    buildsystem: cmake-ninja
    subdir: hdf5-2.2.0
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DHDF5_BUILD_CPP_LIB=ON
      - -DHDF5_ENABLE_ZLIB_SUPPORT=ON
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/HDFGroup/hdf5/releases/download/2.2.0/hdf5-2.2.0.tar.gz
        sha256: 1a1ab8209b35586fbc1aa279ba76d102130b95badcb20ca329587219112d8c16

  - name: med
    buildsystem: cmake-ninja
    builddir: true
    build-options:
      cflags: -std=gnu18
    config-opts:
      - -DMEDFILE_BUILD_PYTHON=ON
      - -DMEDFILE_BUILD_TESTS=OFF
      - -DMEDFILE_INSTALL_DOC=OFF
      # setting this to ON fails building FreeCAD.
      - -DMEDFILE_USE_MPI=OFF
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/chennes/med/archive/refs/tags/v5.0.0.tar.gz
        sha256: 8701f142087b87e8b74958fd0432498eadf28011b20ad05cf56bf911be081888
      - type: patch
        paths:
          - patches/med-py3.13.patch
          - patches/med-hdf5-1.14.patch
          - patches/med-swig-4.3.0.patch
          - patches/med-gcc15.patch
          - patches/med-headergen.patch

  - name: libspnav
    sources:
      - type: archive
        url: https://github.com/FreeSpacenav/libspnav/releases/download/v1.2/libspnav-1.2.tar.gz
        sha256: 093747e7e03b232e08ff77f1ad7f48552c06ac5236316a5012db4269951c39db

  - name: boost
    buildsystem: simple
    build-commands:
      - ./bootstrap.sh --prefix=/app --with-libraries=filesystem,program_options,regex,system,thread,python,chrono,iostreams
      - ./b2 install -j $FLATPAK_BUILDER_N_JOBS
    sources:
      - type: archive
        url: https://archives.boost.io/release/1.89.0/source/boost_1_89_0.tar.bz2
        sha256: 85a33fa22621b4f314f8e85e1a5e2a9363d22e4f4992925d4bb3bc631b5a0c7a

  - name: coin
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DZLIB_RUNTIME_LINKING=OFF
      - -DCOIN_BUILD_TESTS=OFF
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/coin3d/coin/releases/download/v4.0.10/coin-4.0.10-src.zip
        sha256: 9acf49fa2d4a2ed0fe45a03aeafd3d190fcdd3a79cc58ee1efc150e314fd5a5d

  - name: quarter
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DQUARTER_BUILD_PLUGIN=OFF
      - -DQUARTER_BUILD_EXAMPLES=OFF
    sources:
      - type: archive
        url: https://github.com/coin3d/quarter/releases/download/v1.2.3/quarter-1.2.3-src.tar.gz
        sha256: 18d9c11c738bd85db782036cfdc7117691928ab62697249621dcd5716acdb1ab

  - name: pivy
    buildsystem: cmake-ninja
    config-opts:
      - -DPIVY_USE_QT6=ON
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    sources:
      - type: archive
        url: https://github.com/coin3d/pivy/archive/refs/tags/0.6.11.tar.gz
        sha256: 78f79bd7d1ce7e8140ceba4b1220136ea1f14b4403b1e463c59fa892feed961e
      - type: shell
        commands:
          - |
            sitepackagesDir=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["platlib"].replace("/usr","/app"))')
            sed -i "s|\${Python_SITEARCH}|$sitepackagesDir|" {*/,./}CMakeLists.txt

  - name: geos
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://github.com/libgeos/geos/releases/download/3.14.1/geos-3.14.1.tar.bz2
        sha256: 3c20919cda9a505db07b5216baa980bacdaa0702da715b43f176fb07eff7e716

  # pybind from pip doesn't install cmake and include files where freecad finds them so we use cmake
  - name: pybind11
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
    sources:
      - type: archive
        url: https://github.com/pybind/pybind11/archive/refs/tags/v3.1.0.tar.gz
        sha256: ef712655692a2e9bf7bb7874c022564a45f91d847ddee987e720cd9e28849665
      - type: shell
        commands:
        - pip3 install . --verbose --exists-action=i --no-index --prefix=${FLATPAK_DEST} --no-build-isolation

  - name: qhull
    buildsystem: cmake-ninja
    cleanup:
      - /bin
      - /share/doc
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DBUILD_STATIC_LIBS=OFF
      - -DLINK_APPS_SHARED=ON
    sources:
      - type: archive
        url: http://www.qhull.org/download/qhull-2020-src-8.0.2.tgz
        sha256: b5c2d7eb833278881b952c8a52d20179eab87766b00b865000469a45c1838b7e

  # modules used in freecad and matplotlib dependencies
  - python3-modules.yaml

  # matplotlib requires additional sources so we can't simply use flatpak-pip-generator for it
  - name: python3-matplotlib
    buildsystem: simple
    build-commands:
      - python -m pip install --root=/ --prefix=/app --no-build-isolation --config-settings=setup-args="-Dsystem-freetype=true" --config-settings=setup-args="-Dsystem-qhull=true" .
    sources:
      - type: archive
        url: https://files.pythonhosted.org/packages/49/64/f9a391af28f518b11ad45a8a712353c94a0aefce09d3703200e5c54b610a/matplotlib-3.11.1.tar.gz
        sha256: 69647db5746941c793d6e445a4cd349323ffb87d9cc958c2ad84a659b4832d30
      - type: archive
        url: https://github.com/harfbuzz/harfbuzz/releases/download/14.1.0/harfbuzz-14.1.0.tar.xz
        sha256: ee0eb3a1da2c5a28147f12dff55f6c7d60aeeeb29ac7ef334eabe84c8476c105
        dest: subprojects/harfbuzz-14.1.0
      - type: archive
        url: https://github.com/Tehreer/SheenBidi/archive/refs/tags/v3.0.0/sheenbidi-3.0.0.tar.gz
        sha256: 86c56014034739ba39a24c23eb00323b0bf6f737354f665786015fca842af786
        dest: subprojects/SheenBidi-3.0.0
      - type: archive
        url: https://github.com/HOST-Oman/libraqm/archive/v0.10.5/libraqm-0.10.5.tar.gz
        sha256: 7f3dd21b4b3bd28a36f2c911d31d91a9d69341697713923ef1aac65d56ebcafd
        dest: subprojects/libraqm-0.10.5

  - name: netcdf
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DNETCDF_ENABLE_EXAMPLES=OFF
      - -DBUILD_TESTING=OFF
      - -Wno-dev
    cleanup:
      - /bin
    sources:
      - type: archive
        url: https://downloads.unidata.ucar.edu/netcdf-c/4.10.1/netcdf-c-4.10.1.tar.gz
        sha256: db3b69ff4a5ee1a7d79a5c36664d2128b752c266e966369fcf7311ec5f927564

  - name: VTK
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DVTK_WRAP_PYTHON=on
      - -DVTK_BUILD_TESTING=OFF
    cleanup:
      - /bin
      - /share/doc
    sources:
      - type: archive
        url: https://vtk.org/files/release/9.6/VTK-9.6.2.tar.gz
        sha256: aed12cec12a9609179bf66329070266627ca64244a10856a452b2a17ffb04a1d

  - name: flann
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_MATLAB_BINDINGS=OFF
      - -DBUILD_PYTHON_BINDINGS=OFF
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_TESTS=OFF
      - -DBUILD_DOC=OFF
      - -DBUILD_TESTS=OFF
    sources:
      - type: archive
        url: https://github.com/flann-lib/flann/archive/refs/tags/1.9.2.tar.gz
        sha256: e26829bb0017f317d9cc45ab83ddcb8b16d75ada1ae07157006c1e7d601c8824

  - name: pcl
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DWITH_QT=QT6
      - -DWITH_VTK=ON
      - -DBUILD_tools=ON
      - -DBUILD_global_tests=OFF
      - -DBUILD_examples=OFF
      - -DBUILD_apps=OFF
      - -DBUILD_outofcore=OFF
      - -DCMAKE_POSITION_INDEPENDENT_CODE=ON
    cleanup:
      - /include
      - /lib/cmake
      - /lib/pkgconfig
      - /share/pcl-1.15
      - /bin
    sources:
      - type: archive
        url: https://github.com/PointCloudLibrary/pcl/archive/refs/tags/pcl-1.15.1.tar.gz
        sha256: e1d862c7b6bd27a45884a825a2e509bfcbd4561307d5bfe17ce5c8a3d94a6c29
      - type: patch
        path: patches/pcl-boost-system.patch
      - type: patch
        path: patches/pcl-fix-link.patch

  # for opencascade. It was dropped from 24.08 runtime.
  - name: tcl
    subdir: unix
    build-options:
      no-debuginfo: true
    cleanup:
      - /bin
      - /man
    post-install:
      # Needed for graphviz
      - ln -s tclsh8.6 /app/bin/tclsh
      - chmod 755 /app/lib/libtcl*.so
    sources:
      - type: archive
        url: https://downloads.sourceforge.net/project/tcl/Tcl/8.6.17/tcl8.6.17-src.tar.gz
        sha256: a3903371efcce8a405c5c245d029e9f6850258a60fa3761c4d58995610949b31

  - name: opencascade
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DUSE_VTK=ON
      - -DUSE_TK=OFF
    cleanup:
      - /bin
      - /share/opencascade
      - /share/doc
    sources:
      - type: archive
        url: https://github.com/Open-Cascade-SAS/OCCT/archive/refs/tags/V7_9_3.tar.gz
        sha256: 5ecf094ec6b12d5413dfb851d8c3590c354058aee556e32e408bdfbf8c357d57

  - name: netgen
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DUSE_PYTHON=ON
      - -DPREFER_SYSTEM_PYBIND11=ON
      - -DUSE_OCC=ON
      - -DUSE_SUPERBUILD=OFF
      - -DUSE_NATIVE_ARCH=OFF
      - -DUSE_GUI=OFF
      - -DENABLE_UNIT_TESTS=OFF
      - -DUSE_CCACHE=ON
    cleanup:
      - /lib/cmake
      - /include
    sources:
      - type: archive
        url: https://github.com/NGSolve/netgen/archive/refs/tags/v6.2.2603.tar.gz
        sha256: 5afe58ed86c9832adf41a7b9dfdc166fed46841cab9d87ca17d22f41377007cf
      - type: patch
        path: patches/netgen-arm64-compile-fix.patch

  # new deps for IfcOpenShell
  - name: mpfr
    sources:
      - type: archive
        url: https://ftp.gnu.org/gnu/mpfr/mpfr-3.1.5.tar.xz
        sha256: 015fde82b3979fbe5f83501986d328331ba8ddf008c1ff3da3c238f49ca062bc
  - name: cgal
    cleanup:
      - /include
      - /lib/cmake
      - /share/man
      - /bin
    buildsystem: cmake-ninja
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DCGAL_HEADER_ONLY=ON
    sources:
      - type: archive
        url: https://github.com/CGAL/cgal/releases/download/v6.1/CGAL-6.1.tar.xz
        sha256: 618da8a8b3f5be46b4f0a47a1efb3c9e6c03d6aab0f5531d56d355d32701d79f
  - name: nlohmann-json
    buildsystem: cmake-ninja
    config-opts:
      - -DJSON_BuildTests=OFF
    sources:
      - type: archive
        url: https://github.com/nlohmann/json/archive/refs/tags/v3.12.0.tar.gz
        sha256: 4b92eb0c06d10683f7447ce9406cb97cd4b453be18d7279320f7b2f025c10187

  - name: IfcOpenShell
    buildsystem: cmake-ninja
    builddir: true
    subdir: cmake
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DBUILD_EXAMPLES=OFF
      - -DBUILD_GEOMSERVER=OFF
      - -DBUILD_CONVERT=ON
      - -DENABLE_BUILD_OPTIMIZATIONS=ON
      - -DGLTF_SUPPORT=ON
      - -DHDF5_SUPPORT=ON
      - -DCOLLADA_SUPPORT=OFF
      - -DLIBXML2_INCLUDE_DIR=/usr/include/libxml2
    build-options:
      cxxflags: -std=gnu++14
    build-commands:
      - sed -i 's|/usr|/app|g' ifcwrap/cmake_install.cmake
    sources:
      - type: git
        url: https://github.com/IfcOpenShell/IfcOpenShell.git
        tag: ifcopenshell-python-0.8.4
        commit: 158fe92644cfe2bc37be513d9838c95d9f2233cf
  - name: lapack
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DBUILD_TESTING=OFF
      - -DLAPACK_TESTING_USE_PYTHON=OFF
    sources:
      - type: archive
        url: https://github.com/Reference-LAPACK/lapack/archive/refs/tags/v3.10.1.tar.gz
        sha256: cd005cd021f144d7d5f7f33c943942db9f03a28d110d6a3b80d718a295f7f714
      - type: patch
        path: patches/lapack-cmake.patch

  - name: arpack
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DTESTS=OFF
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
    build-options:
      env:
        FFLAGS: -fallow-argument-mismatch
        FCFLAGS: -fallow-argument-mismatch
    sources:
      - type: archive
        url: https://github.com/opencollab/arpack-ng/archive/refs/tags/3.7.0.tar.gz
        sha256: 972e3fc3cd0b9d6b5a737c9bf6fd07515c0d6549319d4ffb06970e64fa3cc2d6

  - name: spooles
    buildsystem: simple
    build-commands:
      - make CC=gcc lib
      - make -C MT/src CC=gcc
      - install -Dt /app/lib *.a MT/src/*.a
      - for f in $(find -name '*.h'); do install -Dt "/app/include/$(dirname "$f")" "$f"; done
    sources:
      - type: archive
        url: http://deb.debian.org/debian/pool/main/s/spooles/spooles_2.2.orig.tar.gz
        sha256: a84559a0e987a1e423055ef4fdf3035d55b65bbe4bf915efaa1a35bef7f8c5dd
        strip-components: 0
        mirror-urls:
          - http://www.netlib.org/linalg/spooles/spooles.2.2.tgz # can be slow
      - type: patch
        path: patches/spooles-fix-compilation.patch

  - name: OpenBLAS
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=Release
      - -DCMAKE_POLICY_VERSION_MINIMUM=3.5
      - -DDYNAMIC_ARCH=ON
    sources:
      - type: archive
        url: https://github.com/OpenMathLib/OpenBLAS/archive/refs/tags/v0.3.28.tar.gz
        sha256: f1003466ad074e9b0c8d421a204121100b0751c96fc6fcf3d1456bd12f8a00a1

  - name: calculix-ccx
    buildsystem: simple
    build-commands:
      - make -C ccx_*/src -f Makefile_MT -j $FLATPAK_BUILDER_N_JOBS
      - install -m0755 ccx_*/src/ccx_*_MT /app/bin/ccx
    sources:
      - type: archive
        url: http://www.dhondt.de/ccx_2.23.src.tar.bz2
        sha256: 9c88385c10fb04f5dc6c4e98027a51bebdd8aee3920e05190d6c1dd08357d6e7
        strip-components: 2
      - type: patch
        path: patches/calculix-cxx-paths.patch

  - name: gmsh
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DENABLE_TESTS=OFF
    cleanup:
      - /share/doc
    sources:
      - type: archive
        url: https://gmsh.info/src/gmsh-4.15.0-source.tgz
        sha256: abb2632715bd7d0130ded7144fd6263635cd7dea883b8df61ba4da58ce6a1dfe

  - name: yaml-cpp
    buildsystem: cmake-ninja
    build-options:
      cxxflags: -include cstdint
    config-opts:
      - -DBUILD_SHARED_LIBS=ON
      - -DYAML_CPP_BUILD_TOOLS=OFF
    sources:
      - type: git
        url: https://github.com/jbeder/yaml-cpp
        commit: 56e3bb550c91fd7005566f19c079cb7a503223cf # tag yaml-cpp-0.9.0

  - name: opencamlib
    buildsystem: simple
    build-commands:
      - pip3 install --exists-action=i --ignore-installed --no-index --find-links="file://${PWD}" --prefix=${FLATPAK_DEST} . --no-build-isolation
    build-options:
      env:
        - CMAKE_ARGS: "${CMAKE_ARGS} -DBUILD_DOC:BOOL=OFF -DVERSION_STRING:STRING=2023.01.11"
    sources:
      - type: archive
        url: https://github.com/aewallin/opencamlib/archive/2023.01.11/opencamlib-2023.01.11.tar.gz
        sha256: 07fd9b61c39c4d600e441d67edbafc1015e9e3fabd88b561a647f98fedf31d41
      - type: patch
        path: patches/opencamlib-boost-shared-no-git-version-command.patch
      - type: shell
        commands:
          - sed -i 's/cmake.verbose/build.verbose/' pyproject.toml

  - name: FreeCAD
    buildsystem: cmake-ninja
    builddir: true
    config-opts:
      - -DFC_FLATPAK=ON
      - -DCMAKE_BUILD_TYPE=RelWithDebInfo
      - -DENABLE_DEVELOPER_TESTS=OFF
      - -DCMAKE_INSTALL_PREFIX=/app/freecad
      - -DCMAKE_INSTALL_DATAROOTDIR=/app/share
      - -DINSTALL_TO_SITEPACKAGES=ON
      - -DFREECAD_USE_PCL=ON
      # While redundant (this triggers a warning with the linter) removing this
      # cause CMake to stop finding dependencies.
      - -DCMAKE_PREFIX_PATH=/app
    cleanup:
      - /freecad/include
      - /freecad/lib/cmake
    post-install:
      - install -Dm755 ../openscad.sh ${FLATPAK_DEST}/bin/openscad
      - ln -s /app/freecad/bin/FreeCADCmd /app/bin/FreeCADCmd
      - ln -s /app/freecad/bin/FreeCADCmd /app/bin/freecadcmd
      - ln -s /app/freecad/bin/FreeCAD /app/bin/FreeCAD
      - ln -s /app/freecad/bin/FreeCAD /app/bin/freecad
    sources:
      - type: git
        url: https://github.com/FreeCAD/FreeCAD.git
        commit: 145529fe741292ff0b3977a01195bf0247425794
        tag: 1.1.3
      - type: patch
        path: patches/OpenSCAD_transfermechanism.patch
      - type: patch
        path: patches/FC-fix-coin.patch
      - type: file
        path: openscad.sh
      - type: shell
        commands:
          # revcount needs to be updated any time the source commit or tag is changed
          # to obtain the revcount for a given gitRef (commit hash, branch or tag) run
          # echo $(($(curl -s 'https://api.github.com/repos/FreeCAD/FreeCAD/compare/120ca87015...'"$gitRef"'' | grep '"ahead_by":' | sed -s 's/ //g;s/"ahead_by"://;s/,//')+1))
          - |
            revcount=44987
            sed -i 's|${PACKAGE_WCREF}|'"$revcount"' (Git)|' src/Build/Version.h.cmake
            sed -i 's|${PACKAGE_WCURL}|https://github.com/FreeCAD/FreeCAD.git|' src/Build/Version.h.cmake
          - | # fix paths for flatpak environment
            sed -i 's|/usr|/app|g' cMake/FindOCC.cmake src/Gui/GraphvizView.cpp
            sitepackagesDir=$(python3 -c 'import sysconfig; print(sysconfig.get_paths()["platlib"].replace("/usr","/app"))')
            sed -i "s|\${python_libs}|$sitepackagesDir|" src/Ext/freecad/CMakeLists.txt


